services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: purplle-store-intelligence:latest
    container_name: purplle-store-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  dashboard:
    image: purplle-store-intelligence:latest
    container_name: purplle-store-dashboard
    command: streamlit run dashboard/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    restart: unless-stopped